# .github/workflows/deploy.yml
# GitHub Actions workflow to build and deploy Astro static portfolio to GitHub Pages automatically.
# Ismael Plaza

name: Deploy to GitHub Pages

on:
  # Trigger deployment on every push to the main branch
  push:
    branches: [main]
  # Allow manual deployment runs from the GitHub Actions tab
  workflow_dispatch:

# Set minimal permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping in-progress runs as newer commits are pushed
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build static assets job
  build:
    runs-on: ubuntu-latest
    steps:
      # 1- Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 - Set up Node.js runtime environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3 - Clean install dependencies
      - name: Install dependencies
        run: npm ci

      # 4 - Build static portfolio into 'dist/'
      - name: Build static site with Astro
        run: npm run build

      # 5 - Upload build output artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      # 6 - Deploy static artifact directly to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
